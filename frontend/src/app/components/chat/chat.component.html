<div class="chat-container">

  <div class="messages" #messagesContainer>

    <div
      *ngFor="let message of messages"
      class="message"
      [ngClass]="message.role">

      <div class="bubble">

        <div>
          {{ message.content }}
        </div>

        <div
          *ngIf="message.citations?.length"
          class="citations">

          <h4>Citations</h4>

          <div
            *ngFor="let citation of message.citations"
            class="citation">

            Page {{ citation.pageNumber }}

            <br/>

            {{ citation.content }}

          </div>

        </div>

      </div>

    </div>

    <div *ngIf="loading" class="message assistant">

      <div class="bubble typing">

        Thinking...

      </div>

    </div>

  </div>

  <div class="input-area">

    <textarea
      [(ngModel)]="question"
      placeholder="Ask about your insurance policy">
    </textarea>

    <button
      (click)="ask()"
      [disabled]="loading">

      Ask

    </button>

  </div>

</div>
