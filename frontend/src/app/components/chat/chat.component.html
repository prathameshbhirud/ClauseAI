<div class="chat-container">

  <div
    class="messages"
    #messagesContainer>

    <div
      *ngFor="let message of messages"
      class="message"
      [ngClass]="message.role">

      <div class="bubble">

        <div>
          {{ message.content }}
        </div>

        <div
          *ngIf="message.citations?.length"
          class="citations">

          <div class="citation-title">
            Sources
          </div>

          <div
            *ngFor="let citation of message.citations"
            class="citation">

            <div class="citation-page">

              Page {{ citation.pageNumber }}

            </div>

            <div class="citation-content">

              {{ citation.content }}

            </div>

          </div>

        </div>

      </div>

    </div>

    <div
      *ngIf="loading"
      class="message assistant">

      <div class="bubble typing">

        Thinking...

      </div>

    </div>

  </div>

  <div class="input-area">

    <textarea
      [(ngModel)]="question"
      placeholder="Ask about your insurance policy...">
    </textarea>

    <button
      (click)="ask()">

      ➜

    </button>

  </div>

</div>
