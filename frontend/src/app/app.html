<div class="app-shell">

  <!-- SIDEBAR -->

  <aside class="sidebar">

    <div class="brand">

      <div class="brand-icon">
        💬
      </div>

      <div class="brand-name">
        ClauseAI
      </div>

    </div>

    <div class="sidebar-section">

      <div class="section-label">
        DOCUMENT
      </div>

      <app-upload
        (uploaded)="onUploaded($event)">
      </app-upload>

    </div>

    <div
      *ngIf="uploadedDocument"
      class="document-card">

      <div class="pdf-icon">
        📄
      </div>

      <div class="document-details">

        <div class="document-title">
          {{ uploadedDocument.fileName }}
        </div>

        <div class="document-status">
          ● Ready
        </div>

      </div>

    </div>

    <div class="menu">

      <div class="menu-item active">
        💬 Chat
      </div>

      <div class="menu-item">
        📄 Document Preview
      </div>

      <div class="menu-item">
        ⚖ Key Clauses
      </div>

    </div>

  </aside>

  <!-- MAIN -->

  <main class="main-panel">

    <header class="topbar">

      <div class="topbar-title">

        {{ uploadedDocument?.fileName
          || 'Upload Insurance Policy' }}

      </div>

    </header>

    <div class="chat-page">

      <app-chat
        *ngIf="uploadedDocument && !processing"
        [documentId]="uploadedDocument.id">
      </app-chat>

      <div
        *ngIf="processing"
        class="processing-state">

        Processing document...

      </div>

    </div>

  </main>

</div>
